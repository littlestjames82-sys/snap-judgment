<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Snap Judgment verdict card">
  <rect width="1200" height="630" fill="#0d0d12"/>
  <rect x="24" y="24" width="1152" height="582" rx="14" fill="#16161f" stroke="#b08d3c" stroke-width="3"/>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="6" fill="#b08d3c">THE COURT OF SCREENSHOT AFFAIRS</text>
  <text x="600" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#e8e3d8">SNAP JUDGMENT</text>
  <text x="600" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#d4af5a">Repeat Offender</text>
  <line x1="200" y1="262" x2="1000" y2="262" stroke="#33333f" stroke-width="1"/>
  <text x="210" y="348" text-anchor="middle" font-size="42" fill="#ffffff">310</text>
  <text x="210" y="384" text-anchor="middle" font-size="16" letter-spacing="3" fill="#9a94a6">SCREENSHOTS</text>
  <text x="490" y="348" text-anchor="middle" font-size="42" fill="#ffffff">15.1 MB</text>
  <text x="490" y="384" text-anchor="middle" font-size="16" letter-spacing="3" fill="#9a94a6">OF EVIDENCE</text>
  <text x="770" y="348" text-anchor="middle" font-size="27" fill="#ffffff">Jan 2024 - Nov 2026</text>
  <text x="770" y="384" text-anchor="middle" font-size="16" letter-spacing="3" fill="#9a94a6">SPAN</text>
  <text x="1050" y="348" text-anchor="middle" font-size="42" fill="#ffffff">29.4%</text>
  <text x="1050" y="384" text-anchor="middle" font-size="16" letter-spacing="3" fill="#9a94a6">NIGHT SHARE</text>
  <text x="600" y="448" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="4" fill="#b08d3c">AWARDS</text>
  <text x="600" y="486" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#e8e3d8">Night Owl  ·  The 3 AM Club  ·  Burst Mode</text>
  <text x="600" y="540" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#cfc9ba">Sentence: probation. The screenshots folder gets a check-in once a month.</text>
  <text x="600" y="580" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#6d6878">Judged from file metadata only. No pixels were read.</text>
